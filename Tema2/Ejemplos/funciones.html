<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>Javascript: Functions</title>
    </head>

    <body>
        <script type="text/javascript">
            // DEFINE
            function sayHello() {
                console.log('Hello world !')
            }
            // EJECUTA
            sayHello()

            // DEFINE
            function sum() {
                console.log(2 + 2)
            }
            // EJECUTA
            sum()

            /*
                       * La idea de esta sección es que pruebes de una forma muy sencilla 
                       * las diferentes formas de definir funciones
                       * y ejecutarlas
                       */
            const message = 'Hello world'
            console.log(message)

            function sayHello() {
                const message = 'Hello Cristina'
                console.log(message)
            }

            sayHello()
            console.log(message)





            /*
                 * La idea de esta sección es que pruebes de una forma muy sencilla 
                 * las diferentes formas de definir funciones
                 * y ejecutarlas
                 */
            function sayHello2(name = 'World') {
                console.log('Hello ' + name)
            }

            sayHello2()
            sayHello('Cristina')

            function sum(a, b) {
                console.log(a + b)
            }

            sum(2, 5)
            sum(10, 5)
            sum(20, 50)
            sum(3, 8)

            /*
                         * La idea de esta sección es que pruebes de una forma muy sencilla 
                         * las diferentes formas de definir funciones
                         * y ejecutarlas con un valor de retorno
                         */
            function sayHello(name = 'world') {
                return `Hello ${name}`;
            }

            console.log(sayHello())
            console.log(sayHello('Cristina'))

        </script>
    </body>

</html>
