               <script>

                    /* empezamos con los bucles heredados de java...
                    */

                    for (let i = 0; i < 5; i++) {
                         console.log(i);
                    }

                    // Contando hacia atrás en pasos de 5 unidades
                    for (let i = 50; i >= 0; i -= 5) {
                         console.log(i);
                    }

                    /*poco que añadir, no? */

                    let fruits = ["apple", "banana", "orange"];
                    console.log("vamos a imprimir frutas" + fruits.length); // 3
                    for (let i = 0; i < fruits.length; i++) {
                         console.log(i + ": " + fruits[i]);
                    }


                    /*for in y for of. ES muy común confundirlos, pero el primero se
                    usa con objetos y el segundo con arrays*/
                    let person = { name: "Jorge Piña", age: 20, city: "Alameda de la Sagra City" };

                    for (let key in person) {
                         console.log(key + ": " + person[key]);
                    }
                    if (person.nombre) console.log("nombre: " + person.nombre);// devuelve nombre: Jorge Piña
                    if (person.name) console.log("NAME: " + person.name);// devuelve nombre: Jorge Piña
                    /*aqui mostramos las propiedades de persona, sin saber cuales son sus propiedades
                    el propio lenguaje nos da las propiedades de un objeto, y podemos acceder a ellas con la notación de corchetes*/

                    for (let fruit of fruits) {
                         console.log(fruit);
                    }



                    const users = [
                         //sabemos lo que es name y age
                         { name: "John", age: 15 },
                         { name: "Jane", age: 25 },
                         { name: "Jim", age: 35 },
                         { name: "Manolo", age: 2 },
                    ];

                    //lo podemos manejar con un for in y for of
                    console.log("vamos a imprimir usuarios con for of y for in");
                    for (let user of users) {
                         for (let p in user) {
                              console.log(`${p}: ${user[p]}`); //fijaos que estamos usando literales
                         }
                    }


                    /* ahora podemos recorrer los usuarios de la forma tradicional, es decir, con un for,
                    y dentro de ese for, podemos recorrer las propiedades de cada usuario con un for in*/


                    function printUser(user) {
                         console.log(`${user.name} tiene ${user.age} años.`); //fijaos que estamos usando literales
                         if (user.age >= 18) {
                              //le estamos pasando una función, y dentro podemos poner el codigo que nos dé la gana
                              console.log(
                                   `El usuario ${user.name} es mayor de edad, y puede salir al recreo`
                              );
                         } else {
                              console.log(
                                   `El usuario ${user.name} es menor de edad, y necesita que le firmen su padres`
                              );
                         }
                    }
                    console.log("vamos a imprimir usuarios con for y for in en la funcion printUser");

                    for (i = 0; i < users.length; i++) {
                         printUser(users[i]);
                    }
