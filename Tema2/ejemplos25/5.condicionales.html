          <main>
               <script>
                    //Creamos un ejemplo de condicional if-else

                    let numero = prompt("Introduce un número:"); // Pedimos al usuario que introduzca un número

                    if (numero > 0) {
                         console.log("El número es positivo.");
                    } else if (numero < 0) {
                         console.log("El número es negativo.");
                    } else {
                         console.log("El número es  cero.");
                    } //Creamos un ejemplo de condicional if-else let numero=prompt("Introduce un número: "); //

                    //vamos a probar un ejemplo de condicional switch-case

                    let fruit = prompt("Introduce una fruta (manzana, platano, naranja, zanahoria):"); // Pedimos al usuario que introduzca una fruta
                    fruit = fruit.toLowerCase(); // Convertimos la entrada a minúsculas para evitar problemas de mayúsculas/minúsculas

                    switch (fruit) {
                         case "manzana":
                              console.log("Esto es una manzana.");
                              break;
                         case "platano":
                              console.log("Esto es un plátano.");
                              break;
                         case "naranja":
                              console.log("Esto es una naranja.");
                              break;
                         case "zanahoria":
                              console.log("Cuidao que se lo come Manolo.");
                              break;
                         default:
                              console.log("Fruta desconocida.");
                    }


                    /*operador ternario. ojo ahora parece que no es importante, pero en la parte
                    de react, es muy importante, porque nos permite hacer condicionales
                     en una sola línea de código*/

                    let age = 18;
                    let canVote = age >= 18 ? "Sí, puedes votar." : "No, no puedes votar.";
                    console.log(canVote);


               </script>
