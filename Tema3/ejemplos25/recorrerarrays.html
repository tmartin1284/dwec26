     <body>
          <header>

          <main>
               <script>

                    // Declarar un array
                    const colors = ["Red", "Green", "Blue", "Yellow"];

                    // Acceder a los elementos por índice
                    console.log(colors[0]); // Salida: Red
                    console.log(colors[1]); // Salida: Green
                    console.log(colors[2]); // Salida: Blue
                    console.log(colors[3]); // Salida: Yellow

                    // Acceder al último elemento usando la propiedad length
                    console.log(colors[colors.length - 1]); // Salida: Yellow

                    // Modificar un elemento por índice
                    colors[1] = "Purple";
                    console.log(colors); // Salida: ["Red", "Purple", "Blue", "Yellow"]

                    // Recorrer el array para acceder a cada elemento
                    colors.forEach(function (color, index) {
                         console.log(index + ": " + color);
                    });
                    // Salida:
                    // 0: Red
                    // 1: Purple
                    // 2: Blue
                    // 3: Yellow

                    const fruits = ["Apple", "Banana", "Cherry", "Date"];

                    for (const fruit of fruits) {
                         console.log(fruit);
                    }
                    // Salida:
                    // Apple
                    // Banana
                    // Cherry
                    // Date

                    for (const index in fruits) {
                         console.log(fruits[index]);
                    }
                    // Salida:
                    // Apple
                    // Banana
                    // Cherry
                    // Date


                    //console.log("antes de definir primero" + fruits.primero()); // Salida: Apple

                    Array.prototype.primero = function () {
                         return this[0];
                    };

                    Array.prototype.largo = this.length > 9;

                    Array.prototype.tamano = this.length;


                    console.log("despues de definir primero" + fruits.primero()); // Salida: Apple
                    console.log(fruits.largo ? "el array es muy largo" : "escribe mas cosas en el array"); // Salida: false

                    const artist = ['Michael Jackson', 'Taylor Swift', 'David Bowie', 'Shakira', 'Izan'];

                    for (let i = 0; i < artist.length; i++) {
                         console.log(artist[i]);
                    }
                    // Rellenar a1 con valores aleatorios
                    const a1 = new Array(18);
                    const a2 = new Array(4);
                    for (let i = 0; i < 18; i++) {
                         a1[i] = Math.random();
                    }
                    for (let i = 0; i < a1.length; i++) {
                         console.log(a1[i]);
                    }

               </script>
