<html lang="en" data-bs-theme="light">

     <head>
          <title>Title</title>
          <!-- Required meta tags -->
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />

          <!-- Bootstrap CSS v5.3.8 -->
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
               integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
               crossorigin="anonymous" />
     </head>

     <body>
          <header>
               <!-- place navbar here -->
          </header>
          <main>

               <script>
                    const fruits = ["Apple", "Banana"];
                    fruits.forEach((fruit) => console.log(fruit)); // Salida: "Apple", "Banana"
                    fruits.push("Cherry");
                    console.log(fruits); // Salida: ["Apple", "Banana", "Cherry"]


                    const lastFruit = fruits.pop();
                    console.log(lastFruit); // Salida: Cherry
                    console.log(fruits); // Salida: ["Apple", "Banana"]

                    fruits.push("melocoton");
                    fruits.push("sandia");
                    fruits.push("pina");

                    fruits.forEach((fruit) => console.log(fruit)); // Salida: "Apple", "Banana"

                    const firstFruit = fruits.shift();
                    console.log(firstFruit); // Salida: Apple
                    console.log(fruits); // Salida: ["Banana"]

                    fruits.unshift("fresa");
                    console.log(fruits); // Salida: ["fresa", "Banana"]



                    const moreFruits = ["Cherry", "Date", "mandarina", "kiwi", "naranja"];
                    const allFruits = fruits.concat(moreFruits);
                    console.log(allFruits); // Salida: ["Apple", "Banana", "Cherry", "Date"]
                    console.log(fruits);
                    console.log(moreFruits);

                    fruits.pop("cherry");

                    const someFruits = allFruits.slice(3, 6);
                    console.log(someFruits); // Salida: ["Banana", "Cherry"]


                    allFruits.splice(2, 2, "Blueberry", "quince", "cereza", "limon", "pomelo");
                    console.log(allFruits);

                    function ajofrin(fruit, index) {
                         console.log(index + ": " + fruit);
                    }
                    allFruits.forEach(ajofrin);






                    const upperCaseFruits = allFruits.map(function (fruit) {
                         return fruit.toUpperCase();
                    });
                    console.log(upperCaseFruits); // Salida: ["APPLE", "BANANA", "BLUEBERRY", "DATE"]

                    upperCaseFruits.forEach(fruit => console.log(": " + fruit));

                    allFruits.forEach((fruit, index) => {
                         console.log(index + ": " + fruit);
                    });


                    const alumnos = [{ nombre: "Juan", edad: 20 },
                    { nombre: "María", edad: 22 },
                    { nombre: "Pedro", edad: 19 },
                    { nombre: "Ana", edad: 21 },
                    { nombre: "Luis", edad: 23 },
                    { nombre: "Lucía", edad: 20 },
                    { nombre: "Carlos", edad: 22 },
                    { nombre: "Sofía", edad: 19 },
                    { nombre: "Diego", edad: 21 },
                    { nombre: "Valentina", edad: 23 }
                    ];


                    alumnos.forEach((alumno, index) => {
                         console.log(index + ": " + alumno.nombre + " - " + alumno.edad);
                    });


                    const edades = alumnos.map((alumno) => {
                         return alumno.edad;
                    });
                    edades.forEach((edad, index) => {
                         console.log(index + ": " + edad);
                    });


                    const mayores = edades.filter((edad) => {
                         return edad >= 21;
                    });


                    mayores.forEach((edad, index) => {
                         console.log(index + ": " + edad);
                    });


                    const alumnosmayores = alumnos.filter((alumno) => {
                         return alumno.edad >= 21;
                    });

                    alumnosmayores.forEach((alumno, index) => {
                         console.log(index + ": " + alumno.nombre + " - " + alumno.edad);
                    });


                    const totalEdades = alumnos.reduce((total, alumno) => {
                         return total + alumno.edad;
                    }, 0);


                    console.log("Total de edades: " + totalEdades); // Salida: Total de edades: 210
                    console.log(typeof totalEdades); // Salida: number

                    const edadmayor = alumnos.reduce((mayor, alumno) => {
                         return mayor > alumno.edad ? mayor : alumno.edad;
                    }, 0);

                    console.log("Edad mayor: " + edadmayor); // Salida: Edad mayor: 23


                    const alumnoviejo = alumnos.reduce((mayor, alumno) => {
                         return mayor.edad >= alumno.edad ? mayor : alumno;
                    }, { nombre: "", edad: 0 });


                    console.log("Alumno más viejo: " + alumnoviejo.nombre + " - " + alumnoviejo.edad); // Salida: Alumno más viejo: Luis - 23



                    console.log("estoy vivo"); // Salida: ["Apple", "Banana", "Cherry", "Date"]
               </script>

          </main>

               crossorigin="anonymous"></script>
     </body>

</html>
